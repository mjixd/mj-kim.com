<style>
  /* ---------- tokens (mirrors the Figma 'Site' collection) ---------- */
  :root{
    --bg:#ffffff; --bg-dark:#1f1f1f; --surface:#f5f5f7; --surface-2:#e8e8ed;
    --text:#1d1d1f; --text-inverse:#f5f5f7; --muted:#6e6e73; --line:#e5e5e7;
    --lime:#c3f56a; --lime-soft:#eefbc6; --sky:#06bfff;
    --space-xs:8px; --space-s:16px; --space-m:24px; --space-l:40px; --space-xl:80px;
    --radius:16px;
    --max:1312px; --gutter:clamp(20px, 4.4vw, 64px);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414; --surface:#1f1f1f; --surface-2:#2a2a2a; --text:#f5f5f5; --muted:#a3a7ad; --line:#2e2e2e; --bg-dark:#000000;
    }
  }
  :root[data-theme="dark"]{ --bg:#141414; --surface:#1f1f1f; --surface-2:#2a2a2a; --text:#f5f5f5; --muted:#a3a7ad; --line:#2e2e2e; --bg-dark:#000000; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
  *,*::before,*::after{ box-sizing:inherit; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:"Inter","Domino Sans","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--max); margin:0 auto; padding-left:var(--gutter); padding-right:var(--gutter); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- nav ---------- */
  .nav{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:saturate(1.2) blur(10px); border-bottom:1px solid transparent; transition:border-color .2s; }
  .nav.scrolled{ border-bottom-color:var(--line); }
  .nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:64px; }
  .brand{ font-weight:600; font-size:15px; letter-spacing:-.01em; }
  .links{ display:flex; align-items:center; gap:28px; font-size:15px; }
  .links a{ font-weight:500; color:var(--muted); opacity:.5; cursor:pointer; transition:opacity .15s; } .links a.active, .links a:hover{ color:var(--text); opacity:1; }
  .links .theme{ background:transparent; border:0; width:40px; height:40px; border-radius:999px; cursor:pointer; display:grid; place-items:center; padding:0; overflow:hidden; transition:border-color .2s, background .2s; }
  .links .theme:active .eclipse{ transform:scale(.9); }
  .eclipse{ position:relative; width:28px; height:28px; transition:transform .25s; }
  .eclipse .core{ position:absolute; inset:0; filter:url(#goo); transition:transform .8s cubic-bezier(.2,.8,.2,1); }
  .eclipse .sun{ position:absolute; inset:6px; border-radius:50%; background:linear-gradient(135deg, var(--lime-soft), var(--lime)); }
  .eclipse .moon{ position:absolute; inset:6px; border-radius:50%; background:var(--bg); transform:translate(26px,-11px); transition:transform .8s cubic-bezier(.3,.9,.2,1), background .2s; }
  :root[data-theme="dark"] .eclipse .moon{ transform:translate(5px,-4px); }
  :root[data-theme="dark"] .eclipse .core{ transform:rotate(20deg); }
  :root[data-theme="dark"] .links .theme{ background:transparent; }
  @media (prefers-reduced-motion: reduce){ .eclipse, .eclipse *{ transition:none !important; } }
  @media (max-width:640px){ .links{ gap:20px; font-size:14px; } .nav .wrap{ height:56px; } }

  /* ---------- hero ---------- */
  .hero{ padding-top:clamp(56px,9vw,112px); padding-bottom:clamp(40px,6vw,72px); }
  .hero-kicker{ font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500; margin:0 0 18px; }
  .hero h1{ margin:0; font-weight:600; letter-spacing:-.025em; line-height:1.12; font-size:clamp(30px, 4.3vw, 56px); max-width:1040px; }
  .hero h1 .static{ display:block; text-wrap:balance; }
  .morph{ display:block; filter:url(#threshold) blur(0.4px); line-height:1.12; }
  .morph .slot{ display:inline-block; position:relative; height:1.12em; vertical-align:top; transition:width .45s cubic-bezier(.2,.8,.2,1); }
  .morph .slot + .slot{ margin-left:.24em; }
  /* Avoid will-change here: WebKit skips the parent SVG threshold (webkit.org/b/219729). */
  .morph .l{ position:absolute; left:0; top:0; white-space:nowrap; }
  .morph .slot{ white-space:nowrap; }
  .morph .l2{ opacity:0; }
  .morph.static{ filter:none; }
  @media (max-width:640px){ .morph .slot{ display:block; } .morph .slot + .slot{ margin-left:0; } }
  .hero p.sub{ margin:24px 0 0; max-width:60ch; font-size:clamp(15px,1.4vw,18px); color:var(--muted); }
  .hero p.manifesto{ margin:28px 0 0; max-width:52ch; text-wrap:pretty; font-size:clamp(17px,1.7vw,22px); line-height:1.45; color:var(--text); letter-spacing:-.01em; }
  .hero .meta{ margin-top:36px; display:flex; flex-wrap:wrap; gap:10px 28px; font-size:14px; color:var(--muted); }

  /* ---------- home: full-bleed strips ---------- */
  .strips{ display:flex; flex-direction:column; gap:0; padding-bottom:clamp(56px,8vw,96px); }
  .strip{ display:block; color:inherit; }
  .strip:focus-visible{ outline:2px solid var(--sky); outline-offset:4px; }
  .kv{ position:relative; width:100%; aspect-ratio:16/10; border-radius:var(--radius); background:var(--surface); overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); }
  .kv.wide{ aspect-ratio:21/9; border-radius:0; box-shadow:none; }
  @media (max-width:820px){ .kv.wide{ aspect-ratio:16/9; } }
  .kv img{ width:100%; height:100%; object-fit:cover; }
  .kv .label{ position:absolute; left:16px; top:14px; font-size:12px; color:var(--muted); }
  .kv .dims{ position:absolute; left:16px; top:32px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .kv.wide .dims{ left:var(--gutter); }
  .kv.wide .label{ left:var(--gutter); }
  .kv .art{ display:none; }
  /* strip bottom: edge-to-edge rules + full-height divider */
  .ed{ border-top:1px solid var(--text); border-bottom:1px solid var(--text); }
  .ed-grid{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,3fr); }
  .ed-left{ padding:clamp(22px,2.6vw,36px) clamp(20px,3vw,48px) calc(clamp(22px,2.6vw,36px) + clamp(48px,7vw,88px)) 0; border-right:1px solid var(--text); }
  .ed-left h3{ margin:0; font-size:clamp(14px,1.15vw,16px); font-weight:600; line-height:1.5; letter-spacing:0; text-wrap:pretty; }
  .ed-left .ed-sub{ margin:10px 0 0; font-size:clamp(14px,1.15vw,16px); line-height:1.5; color:var(--muted); }
  .ed-right{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(20px,3vw,48px); padding:clamp(22px,2.6vw,36px) 0 calc(clamp(22px,2.6vw,36px) + clamp(48px,7vw,88px)) clamp(20px,3vw,48px); align-items:start; }
  .ed-body{ margin:0; font-size:clamp(14px,1.15vw,16px); line-height:1.5; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .ed-key b{ display:block; font-size:clamp(14px,1.15vw,16px); font-weight:600; line-height:1.5; }
  .ed-key span{ display:block; margin-top:2px; font-size:clamp(14px,1.15vw,16px); line-height:1.5; color:var(--muted); }
  @media (max-width:820px){
    .ed-grid{ grid-template-columns:1fr; }
    .ed-left{ padding:20px 0 0; border-right:0; border-bottom:0; }
    .ed-right{ grid-template-columns:1fr; gap:14px; padding:16px 0 calc(20px + clamp(48px,7vw,88px)); }
  }
  .stat{ display:flex; align-items:baseline; gap:10px; }

  /* ---------- case page (Apple slide style) ---------- */
  .c-hero h1, .slide h2, .deck-band h2{ text-wrap:balance; }
  .c-hero .lead, .c-hero .role, .slide p, .impact span, .deck-band p, .pager strong{ text-wrap:pretty; }
  .c-hero{ text-align:center; padding:clamp(64px,9vw,120px) 0 clamp(40px,6vw,72px); }
  .c-hero .meta{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500; }
  .c-hero h1{ margin:18px auto 0; font-size:clamp(40px,6.4vw,80px); font-weight:600; letter-spacing:-.03em; line-height:1.05; max-width:14ch; }
  .c-hero .lead{ margin:22px auto 0; font-size:clamp(17px,2vw,24px); line-height:1.4; color:var(--muted); max-width:52ch; }
  .c-hero .role{ margin:18px auto 0; font-size:14px; color:var(--muted); max-width:60ch; }
  .c-hero .kv{ max-width:1100px; margin:clamp(32px,5vw,56px) auto 0; aspect-ratio:16/9; }
  .band{ padding:clamp(56px,8vw,112px) 0; }
  .band.alt{ background:var(--surface); }
  .band.dark{ background:var(--bg-dark); color:var(--text-inverse); }
  .band.dark .muted, .band.dark .tag-ghost{ color:rgba(245,245,247,.6); }
  .slide{ text-align:center; }
  .slide .tag{ margin-bottom:16px; }
  .slide h2{ margin:0 auto; font-size:clamp(30px,4.6vw,56px); font-weight:600; letter-spacing:-.03em; line-height:1.08; max-width:18ch; }
  .slide p{ margin:18px auto 0; font-size:clamp(17px,1.8vw,21px); line-height:1.45; color:var(--muted); max-width:58ch; }
  .slide .kv{ max-width:1100px; margin:clamp(28px,4.5vw,48px) auto 0; aspect-ratio:16/9; }
  .band.alt .kv{ background:var(--bg); }
  .band.dark .slide h2{ color:var(--text-inverse); } .band.dark .slide p{ color:rgba(245,245,247,.7); }
  .impact{ text-align:center; }
  .impact .eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:500; color:rgba(245,245,247,.6); margin-bottom:28px; }
  .impact .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:40px 48px; padding:0; max-width:1100px; margin:0 auto; align-items:start; }
  .impact b{ display:block; font-size:clamp(30px,3.1vw,44px); font-weight:600; letter-spacing:-.03em; line-height:1.05; }
  .impact span{ display:block; margin-top:12px; font-size:15px; color:rgba(245,245,247,.65); max-width:28ch; margin-left:auto; margin-right:auto; }
  .deck-band{ text-align:center; }
  .deck-band h2{ margin:14px auto 0; font-size:clamp(28px,4vw,48px); font-weight:600; letter-spacing:-.03em; max-width:18ch; }
  .deck-band p{ margin:14px auto 22px; color:var(--muted); font-size:clamp(16px,1.6vw,19px); max-width:50ch; }
  .deck-band .deck-chapters{ justify-content:center; margin-bottom:24px; }
  .deck-band .deck-strip{ max-width:900px; margin:32px auto 0; }
  .pager{ background:var(--bg-dark); color:var(--text-inverse); }
  .pager .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:28px; padding-bottom:28px; }
  .pager a{ display:flex; flex-direction:column; gap:4px; min-height:44px; justify-content:center; }
  .pager small{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.7; }
  .pager strong{ font-size:clamp(17px,2vw,22px); font-weight:500; letter-spacing:-.01em; }
  .pager a.prev{ text-align:left; } .pager a.next{ text-align:right; align-items:flex-end; }
  .pager a:hover strong{ text-decoration:underline; text-underline-offset:4px; }
  /* deck entry (shared) */
  .deck-chapters{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:13px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; color:var(--text); background:var(--bg); cursor:pointer; }
  .chip:hover{ border-color:var(--text); }
  .btn{ display:inline-flex; align-items:center; gap:10px; min-height:48px; padding:0 22px; border-radius:999px; background:var(--text); color:var(--bg); font-weight:600; font-size:16px; cursor:pointer; border:0; }
  .btn:hover{ opacity:.9; }
  .deck-strip{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .deck-strip .thumb{ aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:var(--surface-2); position:relative; cursor:pointer; }
  .deck-strip .thumb img{ width:100%; height:100%; object-fit:cover; }
  .deck-strip .thumb span{ position:absolute; left:10px; bottom:8px; font-size:11px; color:var(--muted); }
  .deck-strip .thumb.more{ display:grid; place-items:center; font-weight:600; color:var(--text); font-size:18px; }
  .tag{ display:inline-block; color:#0f1a05; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; padding:7px 14px; border-radius:999px;
    background:linear-gradient(90deg, #eefbc6 0%, #c3f56a 50%, #eefbc6 100%); }
  /* ---------- about ---------- */
  .about-intro{ padding-top:clamp(48px,8vw,96px); padding-bottom:clamp(32px,5vw,64px); }
  .about-intro h1{ margin:0 0 20px; font-size:clamp(34px,5.4vw,64px); font-weight:600; letter-spacing:-.03em; }
  .about-intro p{ margin:0 0 14px; max-width:64ch; font-size:clamp(16px,1.8vw,20px); line-height:1.5; color:var(--muted); }
  .manifesto-block{ padding-bottom:clamp(32px,5vw,64px); }
  .manifesto-block h2{ margin:0 0 14px; font-size:clamp(22px,2.6vw,32px); font-weight:600; letter-spacing:-.02em; }
  .manifesto-block p{ margin:0 0 14px; max-width:68ch; font-size:clamp(16px,1.6vw,19px); line-height:1.55; color:var(--muted); }
  .rows{ border-top:1px solid var(--line); margin-bottom:clamp(32px,5vw,64px); }
  .rows + .rows{ margin-top:-8px; }
  .row{ display:grid; grid-template-columns:260px 1fr; gap:48px; padding:24px 0; border-bottom:1px solid var(--line); }
  .row b{ font-weight:600; font-size:15px; } .row p{ margin:0; color:var(--muted); font-size:16px; max-width:70ch; }
  .company-location{ display:block; margin-top:4px; font-size:13px; font-weight:400; color:var(--muted); }
  @media (max-width:640px){ .row{ grid-template-columns:1fr; gap:8px; } }
  .note{ background:var(--surface); border-radius:var(--radius); padding:clamp(24px,4vw,40px); margin-bottom:clamp(56px,8vw,96px); }
  .note p{ margin:16px 0; max-width:70ch; font-size:clamp(16px,1.6vw,18px); }
  .note a{ font-weight:600; text-decoration:underline; text-underline-offset:4px; }

  /* ---------- footer ---------- */
  footer{ border-top:1px solid var(--line); }
  footer .wrap{ display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:space-between; padding-top:28px; padding-bottom:40px; font-size:13px; color:var(--muted); }


  /* ---------- viewer ---------- */
  .viewer{ position:fixed; inset:0; z-index:50; background:#0b0b0b; color:#fff; display:none; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .viewer.open{ display:flex; }
  .viewer-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; font-size:13px; }
  .viewer-bar .title{ font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .viewer-bar .counter{ opacity:.75; white-space:nowrap; }
  .viewer-bar button{ background:transparent; color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:999px; min-height:36px; padding:0 14px; cursor:pointer; font-size:13px; }
  .viewer-stage{ flex:1; display:grid; place-items:center; padding:0 clamp(8px,2vw,24px); min-height:0; touch-action:pan-y pinch-zoom; }
  .viewer-stage img{ max-width:100%; max-height:100%; width:auto; height:auto; aspect-ratio:16/9; object-fit:contain; background:#111; border-radius:6px; }
  .viewer-stage .ph{ width:min(100%, calc((100vh - 160px) * 16 / 9)); aspect-ratio:16/9; display:grid; place-items:center; border:1px dashed rgba(255,255,255,.25); border-radius:6px; color:rgba(255,255,255,.6); font-size:14px; text-align:center; padding:16px; }
  .viewer-nav{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px 14px; }
  .viewer-nav .chips{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .viewer-nav .chips::-webkit-scrollbar{ display:none; }
  .viewer-nav .chip{ background:transparent; color:#fff; border-color:rgba(255,255,255,.25); white-space:nowrap; }
  .viewer-nav .chip.active{ background:#fff; color:#000; border-color:#fff; }
  .viewer-nav .arrows{ display:flex; gap:8px; }
  .viewer-nav .arrows button{ width:44px; height:44px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff; font-size:18px; cursor:pointer; }
  .viewer-nav .arrows button:disabled{ opacity:.3; cursor:default; }
  .viewer-progress{ height:2px; background:rgba(255,255,255,.12); }
  .viewer-progress i{ display:block; height:100%; background:var(--lime); width:0; transition:width .2s; }
  body.viewer-open{ overflow:hidden; }

  /* ---------- page transitions ---------- */
  #app{ animation:fade .35s ease both; }
  @keyframes fade{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ #app{ animation:none; } }
</style>
</head>

<script>
/* ============================================================
   DATA — edit copy and swap key visuals here.
   Each kv has `src` (image URL or data URI) — leave "" to show the placeholder.
   `from` notes which deck slide the visual comes from.
   ============================================================ */
const CASES = [
  { slug:'samsung', meta:'Samsung · 2024', title:'B2B AI Agent & AI Office', line:'Design assets as the engineering team\u2019s execution standard. AI-readable tokens and a human-in-the-loop QA system.',

let kvRO = null;
function observeKV(){
  if (kvRO) kvRO.disconnect();
  if (!window.ResizeObserver) return;
  kvRO = new ResizeObserver(entries => entries.forEach(e => {
    const el = e.target, out = el.querySelector('.dims'); if (!out) return;
    const w = Math.round(el.clientWidth), h = Math.round(el.clientHeight), dpr = Math.min(window.devicePixelRatio || 1, 3);
    out.textContent = `${w} \u00d7 ${h} px \u00b7 export ${Math.round(w*dpr)} \u00d7 ${Math.round(h*dpr)} @${dpr}x`;
  }));
  document.querySelectorAll('.kv').forEach(el => kvRO.observe(el));
}

function route(){
  const h = location.hash.replace(/^#\/?/, '');
  stopMorph();
  if (h.startsWith('work/')) {
    const parts = h.slice(5).split('/');
    renderCase(parts[0]);
    if (parts[1] === 'deck') openViewer(parts[0], Math.max(0, (parseInt(parts[2],10) || 1) - 1), true); else closeViewer(true);
  }
  else if (h === 'about') renderAbout();
  else renderHome();
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === (h === 'about' ? 'about' : 'home')));
}
window.addEventListener('hashchange', route);

const V = { el:document.getElementById('viewer'), title:document.getElementById('vTitle'), counter:document.getElementById('vCounter'), stage:document.getElementById('vStage'), chips:document.getElementById('vChips'), prog:document.getElementById('vProg'), prev:document.getElementById('vPrev'), next:document.getElementById('vNext'), slug:null, i:0 };
function openViewer(slug, i, silent){
  const d = DECKS[slug]; if (!d) return;
  const c = CASES.find(x => x.slug === slug);
  V.slug = slug; V.i = Math.min(Math.max(0,i), d.slides.length - 1);
  V.title.textContent = c ? c.title : slug;
  V.chips.innerHTML = d.chapters.map(([n,at]) => `<button class="chip" type="button" data-at="${at}">${esc(n)}</button>`).join('');
  V.chips.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => goSlide(parseInt(b.dataset.at,10))));
  V.el.classList.add('open'); document.body.classList.add('viewer-open');
  paint();
  if (!silent) location.hash = `#/work/${slug}/deck/${V.i+1}`;
}
function closeViewer(silent){
  if (!V.el.classList.contains('open')) return;
  V.el.classList.remove('open'); document.body.classList.remove('viewer-open'); V.stage.innerHTML='';
  if (!silent && V.slug) history.replaceState(null, '', `#/work/${V.slug}`);
}
function goSlide(i){
  const d = DECKS[V.slug]; if (!d) return;
  V.i = Math.min(Math.max(0,i), d.slides.length - 1);
  history.replaceState(null, '', `#/work/${V.slug}/deck/${V.i+1}`);
  paint();
}
function paint(){
  const d = DECKS[V.slug]; const name = d.slides[V.i];
  V.counter.textContent = `${V.i+1} / ${d.slides.length}`;
  V.prog.style.width = ((V.i+1) / d.slides.length * 100) + '%';
  V.prev.disabled = V.i === 0; V.next.disabled = V.i === d.slides.length - 1;
  // active chapter chip
  let active = 0; d.chapters.forEach(([n,at],k) => { if (V.i >= at) active = k; });
  V.chips.querySelectorAll('.chip').forEach((b,k) => b.classList.toggle('active', k === active));
  V.stage.innerHTML = '';
  const img = new Image(); img.alt = `${V.title.textContent}, slide ${V.i+1}`; img.src = slideSrc(name);
  img.onerror = () => { const ph = document.createElement('div'); ph.className = 'ph'; ph.innerHTML = `<div><strong>${esc(name)}</strong><br><span style="opacity:.7">Export this frame from Figma to ${esc(DECK_BASE + name + '.png')}</span></div>`; V.stage.innerHTML=''; V.stage.appendChild(ph); };
  V.stage.appendChild(img);
  // preload neighbors
  [V.i-1, V.i+1].forEach(k => { if (d.slides[k]) { const p = new Image(); p.src = slideSrc(d.slides[k]); } });
}
V.prev.addEventListener('click', () => goSlide(V.i-1));
V.next.addEventListener('click', () => goSlide(V.i+1));
document.getElementById('vClose').addEventListener('click', () => closeViewer());
document.addEventListener('keydown', e => {
  if (!V.el.classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goSlide(V.i+1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goSlide(V.i-1); }
  else if (e.key === 'Escape') closeViewer();
});
// swipe
let sx = 0, sy = 0;
V.stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
V.stage.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) goSlide(V.i + (dx < 0 ? 1 : -1)); }, {passive:true});

/* ============================================================
   GOOEY TEXT MORPH — two word slots (front noun × position). The
   changing word melts out and the next melts in through an SVG
   threshold filter; the other word only slides to its new spot.
   Pure DOM text, so font, weight, and letter-spacing match the
   line below exactly. Reduced motion → simple crossfade.
   ============================================================ */
let morphState = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function stopMorph(){ if (morphState){ cancelAnimationFrame(morphState.raf); clearTimeout(morphState.timer); clearTimeout(morphState.timer2); if (morphState.ro) morphState.ro.disconnect(); morphState = null; } }

function startMorph(){
  const host = document.getElementById('morph'), sr = document.getElementById('morphText');
  if (!host) return;
  const slots = { pre: document.getElementById('slotPre'), role: document.getElementById('slotRole') };
  const words = { pre: PREFIXES, role: ROLES };
  const idx = { pre: 0, role: 0 };
  let turn = 0;
  const MORPH = 620, COOLDOWN = 1500;
  const phrase = () => `${PREFIXES[idx.pre]} ${ROLES[idx.role]}`;

  // Measure a word in the h1's own font (so widths are exact) and size the slot.
  const probe = document.createElement('span'); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-9999px'; host.parentElement.appendChild(probe);
  const widthOf = w => { probe.textContent = w; return probe.getBoundingClientRect().width; };
  const sizeSlot = (key, w, instant) => { const el = slots[key]; if (instant) el.style.transition = 'none'; el.style.width = widthOf(w) + 'px'; if (instant){ void el.offsetWidth; el.style.transition = ''; } };

  // Fit: if the phrase is wider than the hero, scale the font down via inline font-size.
  const fit = () => {
    host.style.fontSize = ''; probe.style.fontSize = '';
    const maxW = host.parentElement.getBoundingClientRect().width;
    let fs = parseFloat(getComputedStyle(host).fontSize);
    const widest = () => Math.max(widthOf(PREFIXES[idx.pre]), widthOf(ROLES[idx.role]));
    while (widest() > maxW && fs > 16){ fs -= 1; host.style.fontSize = fs + 'px'; probe.style.fontSize = fs + 'px'; }
  };
  const setLayers = (key, cur, next) => { const el = slots[key]; el.querySelector('.l1').textContent = cur; el.querySelector('.l2').textContent = next || ''; };

  if (reduceMotion){
    host.classList.add('static');
    const tick = () => { const key = turn++ % 2 === 0 ? 'pre' : 'role'; idx[key] = (idx[key] + 1) % words[key].length; setLayers(key, words[key][idx[key]], ''); sizeSlot(key, words[key][idx[key]], true); sr.textContent = phrase(); morphState.timer = setTimeout(tick, COOLDOWN + MORPH); };
    fit(); sizeSlot('pre', PREFIXES[0], true); sizeSlot('role', ROLES[0], true); morphState = { timer: setTimeout(tick, COOLDOWN + MORPH), raf: 0 }; return;
  }

  // blur scales with the hero font size: ~8px at 56px, ~4px at 30px (mobile)
  const blurK = () => { const h = document.querySelector('.hero h1'); const fs = h ? parseFloat(getComputedStyle(h).fontSize) : 56; return Math.max(3, fs * 0.145); };
  let active = 0; const isAnimating = () => active > 0; const pending = { pre:null, role:null };
  function morph(key, nextWord){
    pending[key] = nextWord;
    const el = slots[key], l1 = el.querySelector('.l1'), l2 = el.querySelector('.l2');
    const K = blurK(), CAP = K * 10;
    l2.textContent = nextWord; l2.style.opacity = 0; l2.style.filter = `blur(${K * 2.5}px)`;
    sizeSlot(key, nextWord, false);           // the slot (and the word after it) slides while the text melts
    const t0 = performance.now(); active++;
    const frame = now => {
      const f = Math.min(1, (now - t0) / MORPH);
      // Valgo-style: outgoing blur grows, incoming blur shrinks; the threshold filter does the gooey join.
      const inF = Math.max(0.001, f), outF = Math.max(0.001, 1 - f);
      l2.style.filter = `blur(${Math.min(K / inF - K, CAP)}px)`;  l2.style.opacity = Math.pow(inF, 0.4);
      l1.style.filter = `blur(${Math.min(K / outF - K, CAP)}px)`; l1.style.opacity = Math.pow(outF, 0.4);
      if (f < 1) morphState.raf = requestAnimationFrame(frame);
      else { l1.textContent = nextWord; l1.style.filter = ''; l1.style.opacity = 1; l2.textContent = ''; l2.style.filter = ''; l2.style.opacity = 0; active--; pending[key] = null; sizeSlot(key, nextWord, true); }
    };
    morphState.raf = requestAnimationFrame(frame);
  }

  const STAGGER = 200;
  function step(){
    const lead = turn++ % 2 === 0 ? 'pre' : 'role', follow = lead === 'pre' ? 'role' : 'pre';
    const pick = key => { let n; do { n = (Math.random() * words[key].length) | 0; } while (n === idx[key]); idx[key] = n; return words[key][n]; };
    const w1 = pick(lead), w2 = pick(follow);
    sr.textContent = phrase();
    morph(lead, w1);
    morphState.timer2 = setTimeout(() => morph(follow, w2), STAGGER);
  }
  function schedule(){ morphState.timer = setTimeout(() => { if (!isAnimating()) step(); schedule(); }, COOLDOWN + MORPH + STAGGER); }

  morphState = { raf: 0, timer: 0 };
  window.__morphRedraw = () => {};
  fit(); setLayers('pre', PREFIXES[0], ''); setLayers('role', ROLES[0], ''); sizeSlot('pre', PREFIXES[0], true); sizeSlot('role', ROLES[0], true);
  // entrance: melt in once
  const K0 = blurK(), CAP0 = K0 * 10;
  for (const key of ['pre','role']){ const l1 = slots[key].querySelector('.l1'); l1.style.filter = `blur(${K0 * 2.5}px)`; l1.style.opacity = 0; }
  const t0 = performance.now();
  const enter = now => { const f = Math.min(1, (now - t0) / 1100); const ff = Math.max(0.001, f); for (const key of ['pre','role']){ const l1 = slots[key].querySelector('.l1'); l1.style.filter = `blur(${Math.min(K0 / ff - K0, CAP0)}px)`; l1.style.opacity = Math.pow(ff, 0.4); } if (f < 1) morphState.raf = requestAnimationFrame(enter); else for (const key of ['pre','role']){ const l1 = slots[key].querySelector('.l1'); l1.style.filter=''; l1.style.opacity=1; } };
  morphState.raf = requestAnimationFrame(enter);
  schedule();

  const relayout = () => {
    if (!document.getElementById('morph')) return;
    fit();
    sizeSlot('pre', pending.pre || PREFIXES[idx.pre], true);
    sizeSlot('role', pending.role || ROLES[idx.role], true);
  };
  let rt; const onResize = () => { clearTimeout(rt); rt = setTimeout(relayout, 60); };
  window.addEventListener('resize', onResize);
  if (window.ResizeObserver){ const ro = new ResizeObserver(onResize); ro.observe(host.parentElement); morphState.ro = ro; }
  document.fonts && document.fonts.ready.then(relayout);
}

// nav links: route programmatically so clicks work in any host (and re-render if hash is unchanged)
document.querySelectorAll('.nav a[href^="#/"]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); const t = a.getAttribute('href');
  if (location.hash === t) route(); else { location.hash = t; }
}));
// delegated: any in-app link (cards, pager) also routes programmatically
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]'); if (!a || a.closest('.nav')) return;
  e.preventDefault(); const t = a.getAttribute('href'); if (location.hash === t) route(); else location.hash = t;
});
// theme: default light (matches Figma); user toggle persisted per browser
(function(){
  let saved = null; try { saved = localStorage.getItem('theme'); } catch(e){}
  const root = document.documentElement, btn = document.getElementById('themeBtn');
  const apply = t => { root.setAttribute('data-theme', t); btn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false'); btn.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'; try { localStorage.setItem('theme', t); } catch(e){} if (window.__morphRedraw) window.__morphRedraw(); };
  apply(saved === 'dark' ? 'dark' : 'light');
  btn.addEventListener('click', () => apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
})();
// boot after all declarations
route();
</script>
